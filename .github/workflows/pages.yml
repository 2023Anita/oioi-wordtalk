name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:atlas
      - name: Build (base /oioi-wordtalk/)
        run: npm run build
        env:
          ATLAS_BASE: /oioi-wordtalk/
      - name: Check size against the 1 GB Pages limit
        run: |
          bytes=$(du -sb dist | cut -f1)
          echo "dist is $((bytes/1024/1024)) MB"
          if [ "$bytes" -gt 1000000000 ]; then echo "::error::dist exceeds the 1 GB GitHub Pages limit"; exit 1; fi
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
